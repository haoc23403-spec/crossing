<style>

    while(true){const r=await wild(CPi);if(r==='done')break}
    $('mb').style.display='none';await fadeTo(1,1600);await ending4();

const getCH=n=>CH[n]||(CH[n]=n==1?mkCH1():n==3?mkCH3():mkCH4());

/* chapter 2 : embedded page, talks to us via postMessage */
const ch2Src=()=>{const e=document.getElementById('ch2src');return e?e.textContent.replace(/<\\\/script/g,'</script'):''};
function playCh2(){
  return new Promise(res=>{
    H.reset();raid=null;setHud('','第二章　渡河');ambient(0,0);beat.vol=0;
    try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
    const f=$('ch2f');let src=ch2Src();
    const c1=SAVE.c1||{};
    const from=c1.paper?(c1.burned?'你燒掉了那張紙，但記得上面那條彎彎的線，走了四天':'你照著紙條走了四天'):'你沒有紙，只憑記憶裡的方向走了四天';
    src=src.replace('你照著紙條走了四天',from);
    const on=e=>{if(e.source!==f.contentWindow||!e.data||e.data.type!=='ch2')return;window.removeEventListener('message',on);
      f.style.display='none';document.body.classList.remove('c2');f.srcdoc='';SAVE.c2={fails:e.data.fails||0};res()};
    window.addEventListener('message',on);
    document.body.classList.add('c2');f.style.display='block';$('fade').style.opacity=0;f.srcdoc=src;
    f.addEventListener('load',()=>{try{f.contentWindow.focus()}catch(e){}},{once:true});
  });
}

/* bridges between chapters (they read what you did) */
async function bridge12(){
  const c=SAVE.c1;
  const t=c.paper?(c.burned?'你燒掉了那張紙，但那條彎彎的線，已經在你腦子裡了。':'那張紙貼著你的胸口。上面只有一條像河的線。'):'你沒有紙。你只記得母親那句話。';
  await panel({k:'',title:'走了四天',body:'<p>'+t+'</p><p>你離開了小鎮。身後沒有人送你，也沒有人知道你去了哪裡——除了她。</p>',btns:[{id:'go',label:'繼續'}]});
}
async function bridge23(){
  const f=SAVE.c2.fails||0;
  const t=f==0?'你一次就過了河。那條河好像在放你走。':f<3?'你被那些光與狗叫聲嚇退過'+f+'次，最後還是游到了對岸。':'你被光與狗叫聲逼退過'+f+'次。每一次回頭，都更接近那個你不想回去的地方。';
  await panel({k:'第二章　完',title:'過河',body:'<p>冰冷的水沒過胸口，你什麼都聽不見，只有自己的呼吸。你游到對岸，趴在泥地上很久沒有動。但這只是第一道河。</p><p>'+t+'</p>',btns:[{id:'go',label:'進入第三章　藏身'}]});
}
async function bridge34(){
  const c=SAVE.c3;
  const t=c.end==='zhou'?'車開了一整夜，把你放在一座廢棄的廠房前。有人說：最後一段，要走路。':c.path==='run'?'你一個人沿著公路走，直到有人把你領進一座廢棄的廠房。':c.path==='surrender'?'你交出了一個名字。有人用那個名字，把你送進了一座廢棄的廠房。':'你躲過了一次，又躲過了一次。最後有人把你帶進一座廢棄的廠房。';
  await panel({k:'',title:'最後一段',body:'<p>'+t+'</p><p>裡面還有四個人。他們都在等天黑。</p>',btns:[{id:'go',label:'繼續'}]});
}
async function recap(){
  const c1=SAVE.c1,c2=SAVE.c2,c3=SAVE.c3,c4=SAVE.c4;
  const NM={cai:'老蔡',mei:'美蘭',kid:'小宇',min:'在民',piao:'朴大哥'};
  const arr=Object.keys(NM).filter(k=>c4.team&&c4.team[k]).map(k=>NM[k]);
  const rows=[];
  rows.push('<dt>配給</dt><dd>'+(c1.reported?'你檢舉了別人，換了一點安全。':c1.paper?(c1.burned?'你收下了那張紙，又燒了它。':'你收下了那張紙，一直留著。'):c1.pushed?'你把那張紙推了回去。':'你什麼也沒有收下。')+'</dd>');
  rows.push('<dt>渡河</dt><dd>'+((c2.fails||0)==0?'一次就過了。':'倒下了 '+c2.fails+' 次，又爬了起來。')+'</dd>');
  rows.push('<dt>藏身</dt><dd>'+(c3.end==='zhou'?'你上了那輛車。':c3.path==='run'?'你一個人跑了。':c3.path==='surrender'?'你把自己交了出去，換來一個名字。':'你躲過了兩次。')+'</dd>');
  rows.push('<dt>最後一夜</dt><dd>'+(arr.length?'到的人：'+arr.join('、'):'只有你到了')+'</dd>');
  rows.push('<dt>母親</dt><dd>'+(c1.mom?'那一夜，你應了她一聲。':'那一夜，你沒有出聲。')+'</dd>');
  await panel({k:'渡江　完',title:'她替你選的',body:'<p>你從四條路走到這裡。每一次選擇，都留在身後。</p><dl>'+rows.join('')+'</dl><p>她說的是：不管發生什麼事，都不要回頭。</p><p>你沒有回頭。但你一直在聽。</p>',
    btns:[{id:'again',label:'回到標題'}]});
}

async function titleScreen(){
  $('fade').style.opacity=1;setHud('','');
  const c=await panel({k:'DUHJANG',title:'渡江',body:'<p>你是李恩惠，二十六歲。深夜停電，母親在床上咳。</p><p>四個章節：<b>配給</b>、<b>渡河</b>、<b>藏身</b>、<b>最後一夜</b>。你在每一章做的選擇，都會被帶到後面。</p>',
    btns:[{id:'new',label:'從第一章開始'},{id:'c2',label:'跳到第二章',ghost:true},{id:'c3',label:'跳到第三章',ghost:true},{id:'c4',label:'跳到第四章',ghost:true}]});
  initAudio();return c;
}
async function main(){
  resize();requestAnimationFrame(frame);
  while(true){
    const c=await titleScreen();
    if(c==='new'){SAVE.c1={};SAVE.c2={};SAVE.c3={};SAVE.c4={}}
    const start=c==='new'?1:+c.slice(1);

    if(start<=2){await playCh2();await bridge23()}
    if(start<=3){await getCH(3).play();await bridge34()}
    await getCH(4).play();
    await recap();
  }
}
main();

    var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), lf = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(95, t); o.frequency.linearRampToValueAtTime(60, t + 1.1);
    lf.frequency.value = 28; lg.gain.value = 0.2; lf.connect(lg); lg.connect(g.gain);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 1.3); lf.start(t); lf.stop(t + 1.3);
    bark(0, 0.4);
  }
  function dogCall(x, z) {
    if (pendingDog || dogCool > 0 || dogs.some(function (d) { return d.active; })) return;
    pendingDog = { t: 2.8, x: x, z: z };
    bark(x > P.x ? 0.8 : -0.8, 0.07);
  }
  function spawnDog(x, z) {
    var dg = null;
    for (var i = 0; i < dogs.length; i++) if (!dogs[i].active) { dg = dogs[i]; break; }
    if (!dg) return;
    dg.active = true; dg.st = 'track'; dg.x = x; dg.z = z; dg.ang = Math.atan2(P.z - z, P.x - x); dg.barkT = 0; dg.mesh.visible = true;
    dogCool = 25;
    setHint('追蹤犬被放出來了。蘆葦擋不住氣味，跳進小溪待一下，才能洗掉氣味。', 7);
  }

  function reset() {
    P = { x: 0, z: START_Z, ang: -Math.PI / 2, anim: 0, stam: 100, exh: false, concealed: false, running: false, dead: false, fall: 0 };
    guards.forEach(function (g) {
      g.x = g.ax; g.z = g.hz; g.dir = 1; g.st = 'patrol'; g.last = null; g.lose = 0; g.srch = 0; g.aim = 0; g.chaseT = 0; g.flashT = 0;
    });
    alarmV = 0; extraBpm = 0; clock = 0;
    pendingDog = null; dogCool = 0; P.water = 0;
    dogs.forEach(function (dg) { dg.active = false; dg.mesh.visible = false; });
    camX = 0; camZ = START_Z + 11;
    hintEl.style.opacity = 1; hintT = 8;
    hintEl.textContent = '穿過蘆葦與鐵絲網缺口，抵達上方的河。被發現後守軍會瞄準你，在他們開槍前衝進蘆葦甩掉他們。';
  }

  function spotted(x, z) {
    var fresh = false;
    guards.forEach(function (g) {
      if (g.st !== 'chase' && Math.hypot(g.x - x, g.z - z) < 40) { g.st = 'chase'; g.last = { x: P.x, z: P.z }; g.lose = 0; g.chaseT = 0; g.aim = 0; fresh = true; }
    });
    if (fresh) { whistle(); stinger(); say(5, true); dogCall(x, z); alarmV = 1; }
  }

  function update(dt) {
    clock += dt;
    var mx = 0, mz = 0, want = 0, wantRun = false;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    if (keys['w'] || keys['arrowup']) mz -= 1;
    if (keys['s'] || keys['arrowdown']) mz += 1;
    var kl = Math.hypot(mx, mz);
    if (kl > 0) { mx /= kl; mz /= kl; want = 1; wantRun = !!keys['shift']; }
    if (ptr.id !== null) {
      var dx = ptr.x - ptr.ox, dy = ptr.y - ptr.oy, d = Math.hypot(dx, dy);
      if (d > 8) { mx = dx / d; mz = dy / d; want = 1; wantRun = d > 55; }
    }
    var reed = inReeds(P.x, P.z);
    P.concealed = !!reed;
    var running = !!(wantRun && want && P.stam > 0 && !P.exh);
    P.running = running;
    var sp = want ? (running ? 6.2 : 3.2) : 0;
    if (reed) sp *= 0.75; else if (P.z > MUD0 && P.z < MUD1) sp *= 0.85;
    if (inWater(P.z)) sp *= 0.7;
    var nx = P.x + mx * sp * dt, nz = P.z + mz * sp * dt;
    if (!blocked(nx, P.z, 0.4)) P.x = clamp(nx, -XW / 2 - 0.5, XW / 2 + 0.5);
    if (!blocked(P.x, nz, 0.4)) P.z = Math.min(nz, START_Z + 4);
    if (want) { P.ang = Math.atan2(mz, mx); P.anim += dt * (running ? 13 : 8); stepT -= dt; if (stepT <= 0) { footstep(running, !!reed, inWater(P.z)); stepT = running ? 0.26 : 0.45; } } else stepT = 0;
    if (running) { P.stam -= 24 * dt; if (P.stam <= 0) { P.stam = 0; P.exh = true; } }
    else { P.stam = Math.min(100, P.stam + (want ? 16 : 26) * dt); if (P.exh && P.stam >= 35) P.exh = false; }
    var sightR = reed ? (running ? 6 : 2.5) : 9999;

    towers.forEach(function (t) {
      t.ang = t.base + t.amp * Math.sin(clock * t.w);
      if (!reed && state === 'play') {
        var d2 = Math.hypot(P.x - t.x, P.z - t.z);
        if (d2 < t.range && Math.abs(adiff(Math.atan2(P.z - t.z, P.x - t.x), t.ang)) < t.half) spotted(t.x, t.z);
      }
    });

    var nearest = 9999;
    guards.forEach(function (g) {
      if (state !== 'play') return;
      g.anim += dt * (g.st === 'chase' ? 11 : 6);
      var d = Math.hypot(P.x - g.x, P.z - g.z);
      if (d < nearest) nearest = d;
      var slow = (inReeds(g.x, g.z) ? 0.78 : 1) * (onFence(g.x, g.z) ? 0.5 : 1);
      if (g.st === 'patrol') {
        if (Math.abs(g.z - g.hz) > 0.2) { var vz = g.hz > g.z ? 1 : -1; g.z += vz * 3 * dt * slow; g.ang = vz > 0 ? Math.PI / 2 : -Math.PI / 2; }
        else {
          g.x += g.dir * g.sp * dt * slow;
          if (g.ax < g.bx) { if (g.x > g.bx) g.dir = -1; if (g.x < g.ax) g.dir = 1; }
          else { if (g.x < g.bx) g.dir = 1; if (g.x > g.ax) g.dir = -1; }
          g.ang = g.dir > 0 ? 0 : Math.PI;
        }
        var range = Math.min(9.5, sightR);
        if (d < range && Math.abs(adiff(Math.atan2(P.z - g.z, P.x - g.x), g.ang)) < 0.5) spotted(g.x, g.z);
        else if (running && !reed && d < 5) spotted(g.x, g.z);
      } else if (g.st === 'chase') {
        var sees = d < 17 && !(reed && d > 3);
        g.chaseT += dt;
        if (sees) { g.last = { x: P.x, z: P.z }; g.lose = 0; } else g.lose += dt;
        var aiming = sees && g.chaseT > 1.0 && d < 13;
        if (aiming) { g.aim += dt; g.ang = Math.atan2(P.z - g.z, P.x - g.x); } else g.aim = Math.max(0, g.aim - dt * 2);
        var tx = g.last.x - g.x, tz = g.last.z - g.z, td = Math.hypot(tx, tz);
        if (td > 0.6) { var mv = (aiming ? 0.25 : 1) * 5.0 * dt * slow; g.x += tx / td * mv; g.z += tz / td * mv; if (!aiming) g.ang = Math.atan2(tz, tx); }
        else { g.st = 'search'; g.srch = 3; }
        if (g.lose > 6) { g.st = 'search'; g.srch = 2; }
        if (g.aim >= 1.2 && state === 'play') finish(false, g);
        else if (d < 1.0 && state === 'play') finish(false, g);
      } else {
        g.srch -= dt; g.ang += 1.8 * dt; g.aim = 0; g.chaseT = 0;
        if (d < 5.6 && !reed) { g.st = 'chase'; g.last = { x: P.x, z: P.z }; g.lose = 0; }
        if (g.srch <= 0) g.st = 'patrol';
      }
    });
    // water + dogs
    var wet = inWater(P.z);
    if (wet) P.water += dt; else P.water = Math.max(0, P.water - dt * 0.5);
    dogCool = Math.max(0, dogCool - dt);
    if (pendingDog) {
      pendingDog.t -= dt;
      if (pendingDog.t <= 0) { spawnDog(pendingDog.x, pendingDog.z); pendingDog = null; }
    }
    dogs.forEach(function (dg) {
      if (!dg.active || state !== 'play') return;
      dg.anim += dt * 16;
      var ddx = P.x - dg.x, ddz = P.z - dg.z, dd = Math.hypot(ddx, ddz);
      if (dg.st === 'track') {
        if (P.water > 0.8) { dg.st = 'lost'; dg.lostT = 5; setHint('狗失去了你的氣味。', 4); }
        var wv = Math.sin(clock * 5 + dg.id * 2) * 0.35;
        var slowd = (onFence(dg.x, dg.z) ? 0.6 : 1) * (inWater(dg.z) ? 0.7 : 1);
        dg.ang = Math.atan2(ddz, ddx) + wv;
        dg.x += Math.cos(dg.ang) * 6.0 * dt * slowd; dg.z += Math.sin(dg.ang) * 6.0 * dt * slowd;
        dg.barkT -= dt;
        if (dg.barkT <= 0) { bark(clamp((dg.x - P.x) / 9, -1, 1), clamp(0.5 / (1 + dd / 7), 0.04, 0.4)); dg.barkT = 0.7 + Math.random() * 0.5; }
        if (dd < 1.1 && state === 'play') finish(false, null, 'dog');
      } else {
        dg.lostT -= dt; dg.ang += 2.5 * dt;
        dg.x += Math.cos(dg.ang) * 1.2 * dt; dg.z += Math.sin(dg.ang) * 1.2 * dt;
        if (dd < 3.5 && P.water < 0.3) dg.st = 'track';
        if (dg.lostT <= 0) { dg.active = false; dg.mesh.visible = false; }
      }
    });
    var chasing = guards.some(function (g) { return g.st === 'chase'; }) || dogs.some(function (d) { return d.active && d.st === 'track'; });
    musChase = chasing;
    alarmV = chasing ? 1 : Math.max(0, alarmV - dt);
    extraBpm = clamp((19 - nearest) / 19, 0, 1) * 55 + (chasing ? 28 : 0) + (running ? 8 : 0);
    if (state === 'play') {
      $('state').textContent = chasing ? '被追捕！' : reed ? '藏身中' : '潛行中';
      $('state').style.color = chasing ? '#e0383e' : '';
      $('hid').style.opacity = (reed && !chasing) ? 1 : 0;
    }
    hintT -= dt; if (hintT <= 0) hintEl.style.opacity = 0;
    if (P.z < RIVER_Z + 1.5 && state === 'play') finish(true);
  }

  function syncScene(dt) {
    if (P.dead) P.fall = Math.min(1, P.fall + dt * 2.5);
    player.position.set(P.x, -P.fall * 0.25, P.z); faceTo(player, P.ang); player.rotation.x = P.fall * 1.45;
    animPerson(player, P.anim, P.running ? 0.9 : 0.55);
    player.scale.y = P.concealed ? 0.86 : 1;
    guards.forEach(function (g) {
      g.mesh.position.set(g.x, 0, g.z); faceTo(g.mesh, g.ang);
      animPerson(g.mesh, g.anim, g.st === 'chase' ? 1.0 : 0.5);
      var rg = g.mesh.userData.rig;
      if (g.aim > 0.05 || g.flashT > 0) { rg.armR.rotation.x = -1.45; rg.armL.rotation.x = -1.2; }
      if (g.aim > 0.05 && state === 'play') {
        var ln = Math.hypot(P.x - g.x, P.z - g.z);
        g.laser.visible = true; g.laser.position.set((g.x + P.x) / 2, 1.4, (g.z + P.z) / 2); g.laser.scale.set(1, 1, ln); g.laser.lookAt(P.x, 1.4, P.z);
        g.laser.material.opacity = 0.35 + 0.65 * Math.min(1, g.aim / 1.2);
      } else g.laser.visible = false;
      if (g.flashT > 0) { g.flashT -= dt; g.flash.visible = true; g.flash.position.set(g.x + Math.cos(g.ang) * 1.0, 1.4, g.z + Math.sin(g.ang) * 1.0); } else g.flash.visible = false;
      var ch = g.st === 'chase';
      g.sp1.visible = !ch; g.sp2.visible = ch;
      var sc = ch ? g.sp2 : g.sp1; sc.position.set(g.x, 0, g.z); sc.rotation.y = -g.ang;
      g.b1.visible = !ch; g.b2.visible = ch;
      var bm = ch ? g.b2 : g.b1; bm.position.set(g.x, 0, g.z); bm.rotation.y = -g.ang;
      g.icon.visible = ch || g.st === 'search';
      g.icon.material.map = ch ? texBang : texQ; g.icon.position.set(g.x, 3.0, g.z);
    });
    towers.forEach(function (t) { t.sec.rotation.y = -t.ang; t.beam.rotation.y = -t.ang; });
    dogs.forEach(function (dg) {
      dg.mesh.visible = dg.active;
      if (!dg.active) return;
      dg.mesh.position.set(dg.x, 0, dg.z); faceTo(dg.mesh, dg.ang);
      var lgs = dg.mesh.userData.legs;
      for (var q = 0; q < 4; q++) lgs[q].rotation.x = Math.sin(dg.anim + (q < 2 ? 0 : 2.6) + (q % 2) * 0.4) * (dg.st === 'track' ? 0.9 : 0.25);
    });
    // river waves
    var pa = riverGeo.attributes.position, arr = pa.array;
    for (var i = 0; i < arr.length; i += 3) arr[i + 2] = riverBase[i + 2] + Math.sin(riverBase[i] * 0.3 + clock * 1.3 + riverBase[i + 1] * 0.4) * 0.12;
    pa.needsUpdate = true;
    // camera
    var asp = camera.aspect, h = asp < 0.8 ? 15 : 11.5, back = asp < 0.8 ? 11 : 9.5;
    camX += (P.x * 0.7 - camX) * Math.min(1, dt * 4);
    camZ += (P.z + back - camZ) * Math.min(1, dt * 5);
    var sh = (alarmV > 0.5 && !reduce) ? (Math.random() - 0.5) * 0.08 : 0;
    camera.position.set(camX + sh, h, camZ);
    camera.lookAt(camX * 0.9, 0, P.z - 2.5);
    $('alarm').style.opacity = alarmV > 0 ? String(0.35 + 0.35 * Math.abs(Math.sin(clock * 8)) * alarmV) : '0';
    $('stamFill').style.width = P.stam + '%'; $('stamFill').className = 'fi' + (P.exh ? ' ex' : '');
    var prog = clamp((START_Z - P.z) / (START_Z - RIVER_Z), 0, 1);
    $('progDot').style.bottom = 'calc(' + (prog * 100) + '% - 3px)';
    if (drone && ac) { drone.lp.frequency.value = 120 + extraBpm * 2; }
  }

  function finish(win, shooter, cause) {
    state = 'over'; if (!win) window.__fails = (window.__fails || 0) + 1;
    stopMusic(); stopAnn();
    if (win) knock(0.3);
    else {
      P.dead = true; lastCause = cause || 'shot';
      if (shooter) shooter.flashT = 0.2;
      if (lastCause === 'dog') growl(); else gunshot();
      flashScreen();
    }
    $('hid').style.opacity = 0; hintEl.style.opacity = 0;
    setTimeout(function () {
      $('fade').classList.add('on');
      setTimeout(function () {
        stopBeat(); extraBpm = 0;
        if (win) { try { parent.postMessage({ type: 'ch2', win: true, fails: (window.__fails || 0) }, '*'); } catch (e) {} return; }
        $('tSub').textContent = win ? '第二章　完' : '第二章　中斷';
        $('tH').textContent = win ? '過河' : (lastCause === 'dog' ? '犬吠' : '槍響');
        $('tP').textContent = win ? '冰冷的水沒過胸口，你什麼都聽不見，只有自己的呼吸。你游到對岸，趴在泥地上很久沒有動。但這只是第一道河。' : (lastCause === 'dog' ? '黑暗裡只剩下狗吠聲，越來越近，越來越近。然後，一切歸於寂靜。' : '一聲槍響劃破夜空，蘆葦叢裡什麼都不動了。然後，一切歸於寂靜。');
        $('tC').textContent = '';
        $('goBtn').textContent = win ? '再玩一次' : '再試一次';
        $('title').hidden = false;
        setTimeout(function () { $('fade').classList.remove('on'); }, 150);
      }, 950);
    }, win ? 500 : 1300);
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (P) {
      if (state === 'play') update(dt); else { clock += dt; }
      syncScene(dt);
    } else {
      camera.position.set(0, 12, START_Z + 11); camera.lookAt(0, 0, START_Z - 3);
    }
    atmos(dt);
    if (useComposer && composer) {
      finalPass.uniforms.uTime.value = performance.now() / 1000; finalPass.uniforms.uPulse.value = pulseV;
      composer.render();
    } else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  $('goBtn').addEventListener('click', function () {
    audioInit();
    reset();
    state = 'play';
    $('title').hidden = true;
    $('state').textContent = '潛行中'; $('state').style.color = '';
    startBeat();
  });
  reset();
  requestAnimationFrame(frame);
})();
<\/script>
